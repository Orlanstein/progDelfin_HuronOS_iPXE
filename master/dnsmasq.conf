# Interfaz de red interna iPXE
interface=br-ipxe
bind-interfaces
no-resolv
no-poll

# DHCP range y opciones básicas
dhcp-range=192.168.100.100,192.168.100.200,12h
dhcp-option=3,192.168.100.1
dhcp-option=6,8.8.8.8

# Clientes iPXE (user-class 175): apuntar directamente al script HTTP
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://192.168.100.1/boot.ipxe

# Log detallado de DHCP para depuración
log-dhcp
log-facility=/var/log/dnsmasq.log
