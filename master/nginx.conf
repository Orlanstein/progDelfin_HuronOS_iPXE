server {
    listen 80 default_server;
    server_name _;

    root /var/www/boot;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Servir archivos grandes (squashfs) sin timeout
    sendfile on;
    tcp_nopush on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Persistencia event/contest (hnetsync): puerto 80 para quedar dentro del
    # allowlist de firewall que aplican las directivas (ver libhfirewall.so,
    # solo permite INPUT de vuelta en sport 80/443/8080).
    location /sync/ {
        proxy_pass http://127.0.0.1:8081/sync/;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/boot-access.log;
    error_log  /var/log/nginx/boot-error.log;
}
